<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Regalraster mit Kisten und einem QR-Etikett">
	<defs>
		<linearGradient id="shed-bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#2a0d4f" />
			<stop offset="55%" stop-color="#6d13a0" />
			<stop offset="100%" stop-color="#b455ec" />
		</linearGradient>
		<linearGradient id="shed-box" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#ffffff" stop-opacity="0.26" />
			<stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
		</linearGradient>
	</defs>

	<rect width="1200" height="800" fill="url(#shed-bg)" />

	<!-- Motiv bleibt innerhalb y 190–610, damit jeder Bildausschnitt es vollständig zeigt -->
	<g>
		<!-- Regalböden und Seitenwangen -->
		<g stroke="#ffffff" stroke-opacity="0.2" stroke-width="3">
			<line x1="150" y1="190" x2="1050" y2="190" />
			<line x1="150" y1="400" x2="1050" y2="400" />
			<line x1="150" y1="610" x2="1050" y2="610" />
			<line x1="150" y1="190" x2="150" y2="610" />
			<line x1="450" y1="190" x2="450" y2="610" />
			<line x1="750" y1="190" x2="750" y2="610" />
			<line x1="1050" y1="190" x2="1050" y2="610" />
		</g>

		<!-- Kisten im oberen Fach -->
		<g fill="url(#shed-box)" stroke="#ffffff" stroke-opacity="0.32" stroke-width="2">
			<rect x="182" y="272" width="118" height="118" rx="12" />
			<rect x="322" y="304" width="96" height="86" rx="12" />
			<rect x="482" y="288" width="132" height="102" rx="12" />
			<rect x="646" y="258" width="82" height="132" rx="12" />
			<rect x="782" y="296" width="118" height="94" rx="12" />
			<rect x="930" y="272" width="90" height="118" rx="12" />
		</g>

		<!-- Kisten im unteren Fach -->
		<g fill="url(#shed-box)" stroke="#ffffff" stroke-opacity="0.32" stroke-width="2">
			<rect x="182" y="484" width="124" height="116" rx="12" />
			<rect x="330" y="518" width="88" height="82" rx="12" />
			<rect x="482" y="498" width="112" height="102" rx="12" />
			<rect x="622" y="470" width="106" height="130" rx="12" />
		</g>

		<!-- QR-Etikett als Signatur des Projekts -->
		<g transform="translate(800 460)">
			<rect x="-14" y="-14" width="188" height="188" rx="20" fill="#ffffff" fill-opacity="0.96" />
			<g fill="#2a0d4f">
				<rect x="6" y="6" width="46" height="46" rx="6" />
				<rect x="18" y="18" width="22" height="22" rx="3" fill="#ffffff" />
				<rect x="108" y="6" width="46" height="46" rx="6" />
				<rect x="120" y="18" width="22" height="22" rx="3" fill="#ffffff" />
				<rect x="6" y="108" width="46" height="46" rx="6" />
				<rect x="18" y="120" width="22" height="22" rx="3" fill="#ffffff" />
				<rect x="70" y="6" width="16" height="16" />
				<rect x="70" y="38" width="16" height="16" />
				<rect x="6" y="70" width="16" height="16" />
				<rect x="38" y="70" width="16" height="16" />
				<rect x="70" y="70" width="16" height="16" />
				<rect x="102" y="70" width="16" height="16" />
				<rect x="138" y="70" width="16" height="16" />
				<rect x="70" y="102" width="16" height="16" />
				<rect x="102" y="102" width="16" height="16" />
				<rect x="138" y="102" width="16" height="16" />
				<rect x="70" y="138" width="16" height="16" />
				<rect x="102" y="138" width="16" height="16" />
				<rect x="138" y="138" width="16" height="16" />
			</g>
		</g>
	</g>
</svg>
