<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Bingo-Karte mit abgehakter Diagonale neben einer Team-Rangliste">
	<defs>
		<linearGradient id="bier-bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#3d1a06" />
			<stop offset="50%" stop-color="#a8560c" />
			<stop offset="100%" stop-color="#eba832" />
		</linearGradient>
		<linearGradient id="bier-tile" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#ffffff" stop-opacity="0.26" />
			<stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
		</linearGradient>
	</defs>

	<rect width="1200" height="800" fill="url(#bier-bg)" />

	<!-- Motiv bleibt innerhalb y 190–610 -->
	<g transform="translate(150 190)">
		<g fill="url(#bier-tile)" stroke="#ffffff" stroke-opacity="0.32" stroke-width="2">
			<rect x="0" y="0" width="72" height="72" rx="11" /><rect x="86" y="0" width="72" height="72" rx="11" /><rect x="172" y="0" width="72" height="72" rx="11" /><rect x="258" y="0" width="72" height="72" rx="11" /><rect x="344" y="0" width="72" height="72" rx="11" />
			<rect x="0" y="86" width="72" height="72" rx="11" /><rect x="86" y="86" width="72" height="72" rx="11" /><rect x="172" y="86" width="72" height="72" rx="11" /><rect x="258" y="86" width="72" height="72" rx="11" /><rect x="344" y="86" width="72" height="72" rx="11" />
			<rect x="0" y="172" width="72" height="72" rx="11" /><rect x="86" y="172" width="72" height="72" rx="11" /><rect x="172" y="172" width="72" height="72" rx="11" /><rect x="258" y="172" width="72" height="72" rx="11" /><rect x="344" y="172" width="72" height="72" rx="11" />
			<rect x="0" y="258" width="72" height="72" rx="11" /><rect x="86" y="258" width="72" height="72" rx="11" /><rect x="172" y="258" width="72" height="72" rx="11" /><rect x="258" y="258" width="72" height="72" rx="11" /><rect x="344" y="258" width="72" height="72" rx="11" />
			<rect x="0" y="344" width="72" height="72" rx="11" /><rect x="86" y="344" width="72" height="72" rx="11" /><rect x="172" y="344" width="72" height="72" rx="11" /><rect x="258" y="344" width="72" height="72" rx="11" /><rect x="344" y="344" width="72" height="72" rx="11" />
		</g>

		<!-- Abgeschlossene Diagonale -->
		<g fill="#ffffff" fill-opacity="0.92">
			<rect x="0" y="0" width="72" height="72" rx="11" />
			<rect x="86" y="86" width="72" height="72" rx="11" />
			<rect x="172" y="172" width="72" height="72" rx="11" />
			<rect x="258" y="258" width="72" height="72" rx="11" />
			<rect x="344" y="344" width="72" height="72" rx="11" />
		</g>
		<g stroke="#7a3708" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
			<polyline points="20,36 32,49 54,20" />
			<polyline points="106,122 118,135 140,106" />
			<polyline points="192,208 204,221 226,192" />
			<polyline points="278,294 290,307 312,278" />
			<polyline points="364,380 376,393 398,364" />
		</g>
	</g>

	<!-- Rangliste -->
	<g transform="translate(668 190)">
		<rect x="0" y="0" width="382" height="416" rx="22" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.34" stroke-width="2" />
		<g font-family="Public Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#ffffff">
			<rect x="26" y="34" width="330" height="60" rx="14" fill="#ffffff" fill-opacity="0.26" />
			<text x="50" y="72">1.</text><text x="100" y="72" fill-opacity="0.94">Team Nord</text><text x="332" y="72" text-anchor="end" font-weight="700">184</text>
			<rect x="26" y="112" width="330" height="60" rx="14" fill="#ffffff" fill-opacity="0.18" />
			<text x="50" y="150">2.</text><text x="100" y="150" fill-opacity="0.94">Team Süd</text><text x="332" y="150" text-anchor="end" font-weight="700">161</text>
			<rect x="26" y="190" width="330" height="60" rx="14" fill="#ffffff" fill-opacity="0.12" />
			<text x="50" y="228">3.</text><text x="100" y="228" fill-opacity="0.94">Team Ost</text><text x="332" y="228" text-anchor="end" font-weight="700">143</text>
			<rect x="26" y="268" width="330" height="60" rx="14" fill="#ffffff" fill-opacity="0.08" />
			<text x="50" y="306">4.</text><text x="100" y="306" fill-opacity="0.94">Team West</text><text x="332" y="306" text-anchor="end" font-weight="700">128</text>
			<rect x="26" y="346" width="330" height="44" rx="12" fill="#ffffff" fill-opacity="0.05" />
			<text x="50" y="376" font-size="21" fill-opacity="0.6">5.</text><text x="100" y="376" font-size="21" fill-opacity="0.6">Team Mitte</text><text x="332" y="376" font-size="21" text-anchor="end" fill-opacity="0.6">96</text>
		</g>
	</g>
