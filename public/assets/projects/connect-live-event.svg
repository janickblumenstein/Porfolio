<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Beamerbild, über Verbindungslinien mit vielen Handys verbunden">
	<defs>
		<linearGradient id="conn-bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#0b1030" />
			<stop offset="55%" stop-color="#3a1580" />
			<stop offset="100%" stop-color="#8b3fd6" />
		</linearGradient>
		<radialGradient id="conn-glow" cx="0.5" cy="0.34" r="0.5">
			<stop offset="0%" stop-color="#c561f6" stop-opacity="0.5" />
			<stop offset="100%" stop-color="#c561f6" stop-opacity="0" />
		</radialGradient>
	</defs>

	<rect width="1200" height="800" fill="url(#conn-bg)" />
	<rect width="1200" height="800" fill="url(#conn-glow)" />

	<!-- Motiv bleibt innerhalb y 200–600 -->
	<g stroke="#c561f6" stroke-opacity="0.42" stroke-width="2" fill="none">
		<path d="M600 340 L168 470" /><path d="M600 340 L276 470" /><path d="M600 340 L384 470" />
		<path d="M600 340 L492 470" /><path d="M600 340 L600 470" /><path d="M600 340 L708 470" />
		<path d="M600 340 L816 470" /><path d="M600 340 L924 470" /><path d="M600 340 L1032 470" />
		<path d="M600 340 L222 560" /><path d="M600 340 L438 560" /><path d="M600 340 L762 560" />
		<path d="M600 340 L978 560" />
	</g>

	<!-- Beamerbild -->
	<g transform="translate(414 206)">
		<rect x="0" y="0" width="372" height="134" rx="16" fill="#ffffff" fill-opacity="0.96" />
		<rect x="26" y="26" width="176" height="18" rx="9" fill="#3a1580" fill-opacity="0.88" />
		<rect x="26" y="60" width="132" height="14" rx="7" fill="#3a1580" fill-opacity="0.34" />
		<rect x="26" y="88" width="208" height="14" rx="7" fill="#3a1580" fill-opacity="0.34" />
		<g fill="#3a1580">
			<rect x="278" y="26" width="70" height="70" rx="8" />
			<g fill="#ffffff">
				<rect x="288" y="36" width="15" height="15" /><rect x="323" y="36" width="15" height="15" />
				<rect x="288" y="71" width="15" height="15" /><rect x="305" y="54" width="15" height="15" />
			</g>
		</g>
	</g>

	<!-- Vordere Gerätereihe -->
	<g fill="#ffffff" fill-opacity="0.92">
		<rect x="146" y="470" width="44" height="78" rx="9" /><rect x="254" y="470" width="44" height="78" rx="9" />
		<rect x="362" y="470" width="44" height="78" rx="9" /><rect x="470" y="470" width="44" height="78" rx="9" />
		<rect x="578" y="470" width="44" height="78" rx="9" /><rect x="686" y="470" width="44" height="78" rx="9" />
		<rect x="794" y="470" width="44" height="78" rx="9" /><rect x="902" y="470" width="44" height="78" rx="9" />
		<rect x="1010" y="470" width="44" height="78" rx="9" />
	</g>
	<g fill="#3a1580">
		<circle cx="168" cy="509" r="8" /><circle cx="276" cy="509" r="8" /><circle cx="384" cy="509" r="8" />
		<circle cx="492" cy="509" r="8" /><circle cx="600" cy="509" r="8" /><circle cx="708" cy="509" r="8" />
		<circle cx="816" cy="509" r="8" /><circle cx="924" cy="509" r="8" /><circle cx="1032" cy="509" r="8" />
	</g>

	<!-- Hintere Gerätereihe -->
	<g fill="#ffffff" fill-opacity="0.55">
		<rect x="200" y="560" width="44" height="42" rx="8" /><rect x="308" y="560" width="44" height="42" rx="8" />
		<rect x="416" y="560" width="44" height="42" rx="8" /><rect x="524" y="560" width="44" height="42" rx="8" />
		<rect x="632" y="560" width="44" height="42" rx="8" /><rect x="740" y="560" width="44" height="42" rx="8" />
		<rect x="848" y="560" width="44" height="42" rx="8" /><rect x="956" y="560" width="44" height="42" rx="8" />
